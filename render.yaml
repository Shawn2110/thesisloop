services:
  - type: web
    name: thesisloop
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thesisloop-db
          property: connectionString

databases:
  - name: thesisloop-db
    plan: free
    databaseName: thesisloop
    user: thesisloop
